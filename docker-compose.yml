version: '3.8'

services:
  sentinelmat_postgres:
    image: postgres:16-alpine
    container_name: sentinelmat_postgres
    environment:
      POSTGRES_DB: sentinelmat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinelmat"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentinelmat_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelmat_backend
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: sentinelmat_postgres
      DB_PORT: 5432
      DB_NAME: sentinelmat
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      MATLAB_EXEC_MODE: docker_octave
      OCTAVE_DOCKER_IMAGE: gnuoctave/octave:latest
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./matlab:/workspace/matlab:ro
    depends_on:
      sentinelmat_postgres:
        condition: service_healthy

  sentinelmat_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelmat_frontend
    ports:
      - "5173:80"
    depends_on:
      - sentinelmat_backend

volumes:
  pgdata:
